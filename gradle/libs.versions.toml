[versions]
coroutines = "1.6.4"
gradle = "8.1.1"
kmmbridge = "1.2.1"
kotlin = "2.4.21"

[plugins]
android-library = { id = "com.android.library", version.ref = "gradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
lodge-build = { id = "com.mindera.lodge.build", version = "1.0.0" }

[libraries]
kotlinx-coroutines-core  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }
kmmbridge-github = { group = "co.touchlab.kmmbridge", name = "kmmbridge-github", version.ref = "kmmbridge" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
