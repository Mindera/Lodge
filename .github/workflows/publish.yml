name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    # iOS artifacts can only be built on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # JDK 11 is the Kotlin toolchain, JDK 17 runs AGP.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17
      - uses: android-actions/setup-android@v3
      - run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the XCFramework to the release
        if: github.event_name == 'release'
        run: |
          ./gradlew assembleLodgeReleaseXCFramework
          cd build/XCFrameworks/release
          zip -qry Lodge.xcframework.zip Lodge.xcframework
          swift package compute-checksum Lodge.xcframework.zip > Lodge.xcframework.zip.sha256
          gh release upload "$TAG" Lodge.xcframework.zip Lodge.xcframework.zip.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
